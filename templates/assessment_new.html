{% extends "base.html" %}

{% block title %}New Assessment | Answer Evaluation System{% endblock %}

{% block content %}
<section class="form-card">
    <h2>New Assessment</h2>
    <form method="post">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" placeholder="Class 2 Maths Test 1" required autofocus>

        <label for="class_level">Class</label>
        <select id="class_level" name="class_level" required>
            {% for c in range(1, 6) %}
            <option value="{{ c }}">Class {{ c }}</option>
            {% endfor %}
        </select>

        <label for="subject">Subject</label>
        <select id="subject" name="subject" required>
            {% for s in subjects %}
            <option value="{{ s }}">{{ s }}</option>
            {% endfor %}
        </select>

        <button type="submit" class="btn btn-full">Create Assessment</button>
    </form>
    <p class="form-note">
        <a href="{{ url_for('assessments.list_assessments') }}">Cancel</a>
    </p>
</section>
{% endblock %}
