{% extends "base.html" %}

{% block title %}Register | Answer Evaluation System{% endblock %}

{% block content %}
<section class="form-card">
    <h2>Teacher Registration</h2>
    <form method="post">
        <label for="full_name">Full name</label>
        <input type="text" id="full_name" name="full_name" required autofocus>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password (minimum 8 characters)</label>
        <input type="password" id="password" name="password" minlength="8" required>

        <label for="confirm_password">Confirm password</label>
        <input type="password" id="confirm_password" name="confirm_password" minlength="8" required>

        <label for="signup_code">Teacher signup code</label>
        <input type="text" id="signup_code" name="signup_code" required>

        <button type="submit" class="btn btn-full">Create Account</button>
    </form>
    <p class="form-note">
        Already registered? <a href="{{ url_for('auth.login') }}">Log in</a>
    </p>
</section>
{% endblock %}
